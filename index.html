<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111528"><title>NightLog · 睡前记录</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#f3f1ff;background:#101322}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#1b2040,#101322 55%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:530px;margin:auto;padding:26px 20px 50px}.top{display:flex;justify-content:space-between;align-items:center}.moon{font-size:32px}h1{font-size:30px;margin:12px 0 3px;letter-spacing:.3px}p.sub{color:#a5a9c4;font-size:13px;margin:0 0 26px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1}.tab{background:#252a47;color:#aeb3ce;border:0;padding:12px;border-radius:13px;font-size:15px}.tab.active{background:#7778d9;color:white}.panel{background:#202540;border:1px solid #343957;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 12px 30px #0001}h2{font-size:16px;margin:0 0 14px}small{color:#9da4c7}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice{background:#303653;border:1px solid #454b6b;color:#d7dbf3;border-radius:12px;padding:11px 13px;font-size:14px}.choice.sel{background:#5c58a5;border-color:#b2a7ff;color:white}.thought{display:block;width:100%;text-align:left;margin-bottom:9px;line-height:1.5}input[type=range]{width:100%;accent-color:#a99cff;margin:20px 0 8px}.scale{display:flex;justify-content:space-between;color:#b8bed9;font-size:13px}.level{text-align:center;font-size:17px;color:#d7cfff;font-weight:600}textarea{width:100%;background:#151a30;color:#fff;border:1px solid #4c5272;border-radius:12px;min-height:82px;padding:12px;font:inherit;resize:vertical}button{cursor:pointer;touch-action:manipulation}textarea{font-size:16px}.toast{max-width:calc(100vw - 24px);white-space:normal!important}input[type=range]{min-height:44px}button.primary{width:100%;background:#9991f6;color:#14162a;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:700;margin-top:10px}button.secondary{background:#333958;color:#e6e7ff;border:0;border-radius:12px;padding:10px 14px}.muted{color:#aeb4d0}.entry{border-bottom:1px solid #373c58;padding:14px 0}.entry:last-child{border:0}.entry .date{color:#b8b4fa;font-size:13px}.entry .meta{overflow-wrap:anywhere;margin:8px 0;line-height:1.7}.entry button{color:#f2acb2;background:transparent;border:0;padding:5px 0}.hidden{display:none}.empty{text-align:center;padding:35px 10px;color:#aeb4d0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;line-height:1.7;color:#aeb4d0;margin-top:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#e4dcff;color:#242442;padding:11px 20px;border-radius:24px;display:none;white-space:nowrap}</style></head><body><main><div class="top"><span class="moon">🌙</span><small id="today"></small></div><h1>NightLog</h1><p class="sub">不急着改变，先看看每个晚上的自己。</p><div class="tabs"><button class="tab active" data-tab="record">今晚记录</button><button class="tab" data-tab="history">历史记录</button><button class="tab" data-tab="stats">回顾与备份</button></div><section id="record"><div class="panel"><h2>现在在做什么？</h2><div class="choices" id="activities"></div></div><div class="panel"><h2>为什么还不想睡？</h2><small>可以多选</small><div id="thoughts" style="margin-top:14px"></div></div><div class="panel"><h2>现在有多想睡？</h2><div class="level" id="level">5 / 10</div><input id="sleepiness" type="range" min="0" max="10" value="5"><div class="scale"><span>完全不想睡</span><span>非常想睡</span></div></div><div class="panel"><h2>今晚还有什么事放不下？</h2><textarea id="unfinished" placeholder="例如：还有工作没做完，怕明天忘记……（选填）"></textarea></div><div class="panel"><h2>还有什么想记录的？</h2><textarea id="note" placeholder="选填，写一点点就好……"></textarea></div><button class="primary" id="save">保存这次记录</button><p class="hint">请在 Safari 正式网页中使用；聊天内的文件预览可能禁止按钮脚本。记录仅保存在当前浏览器中，定期导出备份。</p></section><section id="history" class="hidden"><div class="panel"><h2>之前的夜晚</h2><div id="entries"></div></div></section><section id="stats" class="hidden"><div class="panel"><h2>我的记录</h2><div id="summary"></div></div><div class="panel"><h2>备份与恢复</h2><div class="actions"><button class="secondary" id="export">导出 JSON 备份</button><button class="secondary" id="csv">导出 CSV 表格</button><button class="secondary" id="aiExport">导出给 AI 分析</button><button class="secondary" id="importBtn">导入备份</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><p class="hint">导入会合并记录，不会覆盖已有内容。请妥善保管导出文件，其中包含私人记录。</p></div></section></main><div class="toast" id="toast"></div><script>const KEY='nightlog-records-v1';const activities=['📱 刷视频','💬 刷社交','🎮 游戏','🗣️ 聊天','📖 看东西','💼 工作','✨ 其他'];const thoughts=['再刷十分钟吧……','反正已经这么晚了，再晚一会儿也无所谓','我不想就这么结束今天','白天那个事要是我……就好了','脑子停不下来','暂时没有特别的原因'];let activity='',selected=new Set();const $=id=>document.getElementById(id);function validRecords(data){return Array.isArray(data)&&data.every(r=>r&&typeof r.id==='string'&&r.id.length>0&&typeof r.date==='string'&&Number.isFinite(Date.parse(r.date))&&Array.isArray(r.thoughts)&&r.thoughts.every(t=>typeof t==='string')&&Number.isInteger(r.sleepiness)&&r.sleepiness>=0&&r.sleepiness<=10&&['activity','note','unfinished'].every(k=>r[k]===undefined||typeof r[k]==='string'))}function getData(){const raw=localStorage.getItem(KEY);const data=raw===null?[]:JSON.parse(raw);if(!validRecords(data))throw Error('invalid records');return data}function setData(data){localStorage.setItem(KEY,JSON.stringify(data))}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function renderChoices(){ $('activities').innerHTML=activities.map((x,i)=>`<button class="choice ${activity===x?'sel':''}" data-a="${i}">${x}</button>`).join('');$('thoughts').innerHTML=thoughts.map((x,i)=>`<button class="choice thought ${selected.has(x)?'sel':''}" data-t="${i}">${x}</button>`).join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{activity=activities[+b.dataset.a];renderChoices()});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{let x=thoughts[+b.dataset.t];selected.has(x)?selected.delete(x):selected.add(x);renderChoices()})}function safe(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderHistory(){let d=getData().sort((a,b)=>b.date.localeCompare(a.date));$('entries').innerHTML=d.length?d.map(r=>`<div class="entry"><div class="date">${safe(new Date(r.date).toLocaleString('zh-CN',{hour12:false}))}</div><div class="meta">${safe(r.activity||'未选择活动')} · 想睡程度 ${Number(r.sleepiness)}/10<br>${r.thoughts.map(safe).join('、')||'未选择原因'}${r.unfinished?'<br>放不下的事：'+safe(r.unfinished):''}${r.note?'<br>'+safe(r.note):''}</div><button data-delete="${safe(r.id)}">删除记录</button></div>`).join(''):'<div class="empty">还没有记录。今晚开始也不晚 🌙</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这条记录？')){try{setData(getData().filter(r=>r.id!==b.dataset.delete));renderHistory();renderStats()}catch{toast('删除失败，请检查浏览器存储空间')}}})}function renderStats(){let d=getData();let counts={};d.forEach(r=>{if(r.activity)counts[r.activity]=(counts[r.activity]||0)+1});let sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);let avg=d.length?(d.reduce((s,r)=>s+Number(r.sleepiness||0),0)/d.length).toFixed(1):'—';$('summary').innerHTML=`<p>累计记录：<strong>${d.length}</strong> 次</p><p>平均想睡程度：<strong>${avg}/10</strong></p><p>最常记录的活动：<strong>${safe((sorted.length?sorted[0][0]:'暂无'))}</strong></p>`}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['record','history','stats'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));renderHistory();renderStats()});$('sleepiness').oninput=e=>$('level').textContent=e.target.value+' / 10';$('save').onclick=()=>{if(!activity&&!selected.size&&!$('note').value.trim()&&!$('unfinished').value.trim()){toast('先选一项或写点内容吧');return}try{let d=getData();d.push({id:(typeof crypto!=='undefined' && crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random(),date:new Date().toISOString(),activity,thoughts:[...selected],sleepiness:+$('sleepiness').value,note:$('note').value.trim(),unfinished:$('unfinished').value.trim()});setData(d);activity='';selected.clear();$('sleepiness').value=5;$('level').textContent='5 / 10';$('note').value='';$('unfinished').value='';renderChoices();toast('已经记下这个夜晚 🌙')}catch{toast('保存失败，请检查浏览器存储空间')}};function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('export').onclick=()=>download('NightLog-备份-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(getData(),null,2),'application/json');$('csv').onclick=()=>{let rows=[['时间','正在做什么','想法','想睡程度','放不下的事','补充说明'],...getData().map(r=>[r.date,r.activity,r.thoughts.join('；'),r.sleepiness,r.unfinished||'',r.note])];download('NightLog-记录.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('aiExport').onclick=()=>{let d=getData().sort((a,b)=>a.date.localeCompare(b.date));if(!d.length){toast('先保存至少一条记录');return}let lines=d.map(r=>[new Date(r.date).toLocaleString('zh-CN',{hour12:false}),'活动：'+(r.activity||'未选择'),'想法：'+(r.thoughts||[]).join('；'),'想睡程度：'+r.sleepiness+'/10','放不下的事：'+(r.unfinished||'未填写'),'其他：'+(r.note||'未填写')].join(' | '));let prompt='请根据以下睡前记录，分析我在已经困倦时仍推迟睡觉的常见情境和可能诱因。区分观察到的事实与推测，不要作医疗诊断。请给出3个具体、低负担、可在未来一周测试的改善建议，并告诉我还缺少哪些信息。记录时间是填写时间，不一定是实际入睡时间。\n\n'+lines.join('\n');download('NightLog-AI分析-'+new Date().toISOString().slice(0,10)+'.txt',prompt,'text/plain;charset=utf-8')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!validRecords(x))throw Error();let map=new Map(getData().map(r=>[r.id,r]));x.forEach(r=>{if(!map.has(r.id))map.set(r.id,r)});setData([...map.values()]);renderStats();renderHistory();toast('备份导入成功')}catch{toast('文件格式不正确')}e.target.value=''};$('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});renderChoices();try{renderStats()}catch{toast('无法读取本地记录，请检查浏览器存储或备份')}window.addEventListener('error',()=>toast('操作未完成，请检查本地存储和备份'));window.addEventListener('unhandledrejection',()=>toast('操作未完成，请检查本地存储和备份'));</script></body></html>
